<mat-card class="as-card-wrapper" appearance="outlined">
	<mat-card-header class="as-card-header-style">
		<mat-card-title>
			<div class="flex justify-between items-center">
				<div class="heading-section-title">Target Models</div>
				<div>
					<button mat-mini-fab (click)="addTargetModel()" color="success" matTooltip="Add target model">
						<mat-icon>add</mat-icon>
					</button>
				</div>
			</div>
		</mat-card-title>
	</mat-card-header>

	<mat-card-content>
		<as-target-models-table></as-target-models-table>
	</mat-card-content>
</mat-card>
