<div>
	@if (dataSource.data.length > 0) {
		<table mat-table [dataSource]="dataSource">
			<ng-container matColumnDef="id">
				<th mat-header-cell *matHeaderCellDef>#</th>
				<td mat-cell *matCellDef="let parameter">{{ parameter.id }}</td>
			</ng-container>

			<ng-container matColumnDef="parameterKey">
				<th mat-header-cell *matHeaderCellDef>Key</th>
				<td mat-cell *matCellDef="let parameter">{{ parameter.parameterKey }}</td>
			</ng-container>

			<ng-container matColumnDef="paraeterType">
				<th mat-header-cell *matHeaderCellDef>Type</th>
				<td mat-cell *matCellDef="let parameter">{{ parameter.parameterType }}</td>
			</ng-container>

			<ng-container matColumnDef="defaultValue">
				<th mat-header-cell *matHeaderCellDef>Default Value</th>
				<td mat-cell *matCellDef="let parameter">{{ parameter.defaultValue }}</td>
			</ng-container>

			<ng-container matColumnDef="isMandatory">
				<th mat-header-cell *matHeaderCellDef>Is mandatory?</th>
				<td mat-cell *matCellDef="let parameter">
					<mat-checkbox [checked]="parameter.isMandatory" [disabled]="true"></mat-checkbox>
				</td>
			</ng-container>

			<ng-container matColumnDef="isReadOnly">
				<th mat-header-cell *matHeaderCellDef>Is read-only?</th>
				<td mat-cell *matCellDef="let parameter">
					<mat-checkbox [checked]="parameter.isReadOnly" [disabled]="true"></mat-checkbox>
				</td>
			</ng-container>

			<tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
			<tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
		</table>
	} @else {
		<as-table-no-records message="No parameters."></as-table-no-records>
	}

	<mat-paginator
		[disabled]="dataSource.data.length === 0"
		[pageSizeOptions]="[5, 10, 20]"
		showFirstLastButtons
		aria-label="Select page of periodic parameters">
	</mat-paginator>
</div>
