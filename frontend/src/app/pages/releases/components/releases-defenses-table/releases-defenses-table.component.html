<div>
	@if (!defensesStore.isLoading() && dataSource().data.length > 0) {
		<table mat-table [dataSource]="dataSource()">
			<ng-container matColumnDef="id">
				<th mat-header-cell *matHeaderCellDef>#</th>
				<td mat-cell *matCellDef="let defense">{{ defense.id }}</td>
			</ng-container>

			<ng-container matColumnDef="name">
				<th mat-header-cell *matHeaderCellDef>Name</th>
				<td mat-cell *matCellDef="let defense">{{ defense.name }}</td>
			</ng-container>

			<ng-container matColumnDef="repoUrl">
				<th mat-header-cell *matHeaderCellDef>URL</th>
				<td mat-cell *matCellDef="let defense">{{ defense.repoUrl }}</td>
			</ng-container>

			<tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
			<tr
				mat-row
				*matRowDef="let row; columns: displayedColumns"
				(click)="selectRow(row)"
				[class.selected]="row?.id === selectedDefense?.id"></tr>
		</table>
	} @else if (defensesStore.isLoading()) {
		<div class="mt-4">
			<table-skeleton-loader [count]="4"></table-skeleton-loader>
		</div>
	} @else {
		<as-table-no-records message="No defenses."></as-table-no-records>
	}

	<mat-paginator
		[disabled]="dataSource().data.length === 0"
		[pageSizeOptions]="[5, 10, 20]"
		showFirstLastButtons
		aria-label="Select page of periodic defenses">
	</mat-paginator>
</div>
