<mat-card class="as-card-wrapper" appearance="outlined">
	<mat-card-header class="as-card-header-style">
		<mat-card-title>
			<div class="flex justify-between items-center">
				<div class="heading-section-title">Defenses</div>
				<div>
					<button mat-mini-fab (click)="addDefense()" color="success" matTooltip="Add defense">
						<mat-icon>add</mat-icon>
					</button>
				</div>
			</div>
		</mat-card-title>
	</mat-card-header>

	<mat-card-content>
		<as-releases-defenses-table></as-releases-defenses-table>
	</mat-card-content>
</mat-card>
