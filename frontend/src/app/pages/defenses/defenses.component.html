<mat-card class="as-card-wrapper" appearance="outlined">
	<mat-card-header>
		<mat-card-title>
			<div class="flex justify-between center-align">
				<div class="heading-section-title">Defenses</div>
				<div>
					<button mat-mini-fab (click)="addDefense()" color="success">
						<mat-icon>add</mat-icon>
					</button>
				</div>
			</div>
		</mat-card-title>
	</mat-card-header>

	<mat-card-content>
		<as-defenses-table></as-defenses-table>
	</mat-card-content>
</mat-card>
